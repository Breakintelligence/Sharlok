readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.8.5",
    "PyPDF2>=3.0.0",
    "python-pptx>=0.6.23",
    "numpy>=1.24.0",
    "pillow>=12.2.0",
    "pyyaml>=6.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.7.4",
    "typing-extensions>=4.9.0",
]
