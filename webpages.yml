# Sharlok live web search sources.
#
# Topic-keyed lists of URLs for default live web context during analysis and
# recommendations. Sharlok matches the architecture description / query
# against these topic keys (case-insensitive word match against the key name)
# to decide which URLs to fetch. "other" is the fallback used when no topic
# key matches.
#
# Add/remove URLs or whole topics freely — no code changes needed.

